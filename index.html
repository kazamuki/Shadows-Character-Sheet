<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadows — Character Intake</title>
<script src="src/ui/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles/shadows.css">
<link rel="stylesheet" href="src/styles/print.css" media="print">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Shadows <span class="x">//</span> <span class="ctx" id="brandctx">Character Intake</span></div>
    <nav class="topnav" id="topnav" aria-label="Character sheet sections"></nav>
    <div class="hdr-actions" id="hdractions"></div>
    <button class="theme-toggle" type="button" id="themeToggle" aria-pressed="false" aria-label="Switch to light theme">
      <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>
  <nav class="ledger" id="ledger" aria-label="Creation steps"></nav>
  <main id="main"></main>
  <aside class="vitals" id="vitals" aria-label="Live character readout"></aside>
</div>
<div class="vdrawer-scrim" id="vscrim"></div>
<div class="vdrawer" id="vdrawer" aria-label="Vitals" aria-hidden="true"></div>
<footer class="footer collapsed" id="footer"></footer>
<div id="printSheet" aria-hidden="true"></div>
<script src="src/data/shadows-data.js"></script>
<script src="src/data/shadows-icons.js"></script>
<script src="src/engine/engine.js"></script>
<script src="src/ui/shared.js"></script>
<script src="src/ui/wizard.js"></script>
<script src="src/ui/sheet.js"></script>
<script src="src/ui/app.js"></script>
</body>
</html>
