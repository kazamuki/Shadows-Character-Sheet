name: deploy-demo

# Publishes the interactive demo (dist/shadows-character-sheet.html) and the
# standalone blank sheet (dist/shadows-blank-sheet.html) to GitHub Pages at
# charactersheet.shadowsrpg.com. Same trigger as release.yml (a phase tag) —
# the public demo shows only a tagged build, never whatever's mid-flight on
# main, and cutting a tag is already the existing "ready to show this" signal.
#
# One-time setup this workflow depends on (not done here):
#   - Repo Settings -> Pages -> Source: "GitHub Actions"
#   - Repo Settings -> Pages -> Custom domain: charactersheet.shadowsrpg.com
#   - DNS: a CNAME record for "charactersheet" on shadowsrpg.com pointing at
#     the org/user's <name>.github.io
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-flight one finish rather
# than racing a second tag pushed moments later.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble the Pages site
        run: |
          mkdir -p site
          cp dist/shadows-character-sheet.html site/index.html
          cp dist/shadows-blank-sheet.html site/blank-sheet.html
          echo "charactersheet.shadowsrpg.com" > site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
