name: release

# Tag a phase (e.g. v0.4.0-phase-3.3) and the single-file build is attached
# to the GitHub Release. That file is what players download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/shadows-character-sheet.html
          generate_release_notes: true
